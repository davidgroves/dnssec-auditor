services:
  dev:
    image: mcr.microsoft.com/devcontainers/go:1.25-bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    networks: [devnet]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Reachable from the dev service as bind:53. Host port 15353 is left to
  # examples/docker-compose.yaml so both stacks can run at once.
  bind:
    image: internetsystemsconsortium/bind9:9.21
    networks: [devnet]

networks:
  devnet:
