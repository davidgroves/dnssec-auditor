# DNSSEC Auditor example environment
#
#   cd examples
#   docker compose up -d --build
#
# UI: http://localhost:8080
# Grafana (otel-lgtm): http://localhost:3000  (anonymous; dashboard is home)
# BIND: localhost:15353  (dig @localhost -p 15353 example.com SOA)

services:
  bind:
    image: internetsystemsconsortium/bind9:9.20
    container_name: dnssec-auditor-bind
    hostname: bind
    environment:
      - TZ=UTC
    volumes:
      - ./bind/named.conf:/etc/bind/named.conf:ro
      - ./bind/static-zones.conf:/etc/bind/static-zones.conf:ro
      - ./bind/zones:/etc/bind/zones-source:ro
      - bind-zones:/var/lib/bind
    ports:
      - "15353:53/tcp"
      - "15353:53/udp"
    networks:
      - dns-network
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mkdir -p /var/lib/bind/keys
        cp /etc/bind/zones-source/* /var/lib/bind/
        chmod 664 /var/lib/bind/db.*
        echo 'also-notify { };' > /var/lib/bind/also-notify.conf

        cat > /var/lib/bind/rndc-internal.conf <<'EOF'
        key "rndc-key" {
            algorithm hmac-sha256;
            secret "xT7J2kLpN9qRvW4mY8sF1gH5bC3dE6aZ0iO7uP2wX4c=";
        };
        options {
            default-key "rndc-key";
            default-server 127.0.0.1;
            default-port 953;
        };
        EOF

        chown -R bind:bind /var/lib/bind

        (
          api_host=dnssec-auditor
          i=0
          while [ "$$i" -lt 60 ]; do
            set -- $$(getent hosts "$$api_host" 2>/dev/null || true)
            if [ -n "$$1" ]; then
              echo "also-notify { $$1 port 5354; };" > /var/lib/bind/also-notify.conf
              chown bind:bind /var/lib/bind/also-notify.conf
              rndc -c /var/lib/bind/rndc-internal.conf reconfig 2>/dev/null || true
              echo "[entrypoint] NOTIFY target set to $$1"
              break
            fi
            i=$$((i + 1))
            sleep 2
          done
        ) &

        exec /usr/sbin/named -g -c /etc/bind/named.conf -u bind
    healthcheck:
      test: ["CMD-SHELL", "pgrep named > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  dnssec-auditor:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dnssec-auditor
    volumes:
      - ./config.yaml:/etc/dnssec-auditor/config.yaml:ro
    ports:
      - "5354:5354/tcp"
      - "5354:5354/udp"
    expose:
      - "8080"
    networks:
      - dns-network
    depends_on:
      bind:
        condition: service_healthy
    command: ["serve", "--config", "/etc/dnssec-auditor/config.yaml"]
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: dnssec-auditor-frontend
    ports:
      - "8080:80"
    networks:
      - dns-network
    depends_on:
      - dnssec-auditor
    restart: unless-stopped

  # Grafana LGTM all-in-one: Grafana + Prometheus + Loki + Tempo + OTel Collector.
  # Scrapes dnssec-auditor:8080/metrics and provisions examples/grafana/dnssec-auditor.json.
  grafana:
    image: grafana/otel-lgtm:latest
    container_name: dnssec-auditor-grafana
    hostname: grafana
    environment:
      - TZ=UTC
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/otel-lgtm/grafana/conf/provisioning/dashboards/custom/dnssec-auditor.json
    volumes:
      - ./grafana/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./grafana/dnssec-auditor.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/dnssec-auditor.json:ro
      - ./alerts.yaml:/otel-lgtm/alerts.yaml:ro
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    networks:
      - dns-network
    depends_on:
      - dnssec-auditor
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

networks:
  dns-network:
    driver: bridge

volumes:
  bind-zones:
