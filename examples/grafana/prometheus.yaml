# Prometheus config for grafana/otel-lgtm.
# Keeps the image defaults (OTLP ingest) and scrapes the auditor.

global:
  scrape_native_histograms: true
  scrape_interval: 15s

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name

storage:
  tsdb:
    out_of_order_time_window: 10m

rule_files:
  - /otel-lgtm/alerts.yaml

scrape_configs:
  - job_name: dnssec-auditor
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["dnssec-auditor:8080"]
