// BIND 9.20 primary for the DNSSEC Auditor example stack.

options {
    directory "/var/cache/bind";
    key-directory "/var/lib/bind/keys";

    listen-on port 53 { any; };
    listen-on-v6 port 53 { any; };

    allow-query { any; };
    recursion no;
    allow-recursion { none; };
    dnssec-validation no;
    querylog no;

    notify explicit;
    provide-ixfr yes;
    ixfr-from-differences yes;
    max-journal-size 20M;
    serial-update-method unixtime;

    include "/var/lib/bind/also-notify.conf";
};

key "xfr-key" {
    algorithm hmac-sha256;
    secret "K8vC2mP9nQ4rT6wX1yB3fG5hJ7kL0mN2pR4sU6vW8xY=";
};

key "rndc-key" {
    algorithm hmac-sha256;
    secret "xT7J2kLpN9qRvW4mY8sF1gH5bC3dE6aZ0iO7uP2wX4c=";
};

controls {
    inet * port 953 allow { any; } keys { "rndc-key"; };
};

logging {
    channel default_log {
        stderr;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };
    category default { default_log; };
    category dnssec { default_log; };
    category xfer-out { default_log; };
    category notify { default_log; };
};

dnssec-policy "nsec3-optout" {
    keys {
        ksk lifetime unlimited algorithm 13;
        zsk lifetime P90D algorithm 13;
    };
    nsec3param iterations 0 optout yes salt-length 0;
    dnskey-ttl 3600;
    signatures-refresh P5D;
    signatures-validity P14D;
    signatures-validity-dnskey P14D;
    zone-propagation-delay PT5S;
    max-zone-ttl 1D;
};

dnssec-policy "nsec" {
    keys {
        ksk lifetime unlimited algorithm 13;
        zsk lifetime P90D algorithm 13;
    };
    dnskey-ttl 3600;
    signatures-refresh P5D;
    signatures-validity P14D;
    signatures-validity-dnskey P14D;
    zone-propagation-delay PT5S;
    max-zone-ttl 1D;
};

zone "example.com" {
    type primary;
    file "/var/lib/bind/db.example.com";
    dnssec-policy "nsec3-optout";
    allow-transfer { key "xfr-key"; any; };
    allow-update { key "xfr-key"; };
};

zone "nsec.example" {
    type primary;
    file "/var/lib/bind/db.nsec.example";
    dnssec-policy "nsec";
    allow-transfer { key "xfr-key"; any; };
    allow-update { key "xfr-key"; };
};

zone "unsigned.example" {
    type primary;
    file "/var/lib/bind/db.unsigned.example";
    allow-transfer { key "xfr-key"; any; };
    allow-update { key "xfr-key"; };
};

// Pre-signed with a flipped RRSIG. BIND must not re-sign this zone.
zone "broken.example" {
    type primary;
    file "/var/lib/bind/db.broken.example";
    allow-transfer { key "xfr-key"; any; };
};

zone "member.example" {
    type primary;
    file "/var/lib/bind/db.member.example";
    dnssec-policy "nsec3-optout";
    allow-transfer { key "xfr-key"; any; };
    allow-update { key "xfr-key"; };
};

zone "catalog.example" {
    type primary;
    file "/var/lib/bind/db.catalog.example";
    allow-transfer { key "xfr-key"; any; };
    allow-update { key "xfr-key"; };
    notify explicit;
    include "/var/lib/bind/also-notify.conf";
};

// Static pre-signed defect / algorithm / denial examples.
// BIND must not attach a dnssec-policy or it will re-sign them.
include "/etc/bind/static-zones.conf";
